    "projects/06-terrain-bouguer/metal",
    "projects/09-equivalent-sources/metal",
    "projects/10-density-inversion/metal",
    "projects/12-acoustic-1d/metal",
    "projects/13-acoustic-2d/metal",
    "projects/14-born-2d/metal",
    "projects/15-elastic-psv/metal",
    "projects/16-fwi-marmousi/metal",
    "projects/17-rtm/metal",
    "projects/18-lsrtm/metal",
    "projects/21-checkpointing/metal",
    "projects/22-acoustic-3d/metal",
    "projects/24-fast-marching/metal",
    "projects/25-fast-sweeping/metal",
    "projects/26-ray-tracing/metal",
    "projects/27-traveltime-tomo/metal",
    "projects/28-diff-eikonal/metal",
    "projects/30-eq-location/metal",
    "projects/32-mt-1d/metal",
    "projects/34-dc-2d/metal",
    "projects/36-gpr-fdtd/metal",
