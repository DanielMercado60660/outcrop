[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
outcrop-common = { path = "common/rust" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
serde_json = "1"

[profile.release]
debug = false
