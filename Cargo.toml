    "projects/38-template-matching/metal",
    "projects/39-ambient-noise/metal",
    "projects/40-cmp-processing/metal",
    "projects/41-deconvolution/metal",
    "projects/42-fk-radon/metal",
    "projects/44-okada/metal",
    "projects/46-plate-flexure/metal",
    "projects/47-geotherm/metal",
    "projects/48-mantle-convection/metal",
    "projects/49-tsunami/metal",
    "projects/50-wave-sandbox/metal",
